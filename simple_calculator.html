<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Mathematical Operations</h1>
    <h3>Addition Of Two Numbers</h3>
    <p id="resultofaddition"></p>
    <script>
        var num1 = 5;
        var num2 = 8;
        var sum = num1 + num2;
        document.getElementById("resultofaddition").innerHTML =
                "The total sum is" + sum;
    </script>
</body>
</html>
